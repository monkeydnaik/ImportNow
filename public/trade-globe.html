<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ImportNow interactive trade globe</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%;touch-action:pan-y}.fallback{position:absolute;inset:0;display:grid;place-items:center;color:#d9e7ef;font:13px system-ui;text-align:center;padding:24px}</style></head>
<body><div id="fallback" class="fallback">Loading the interactive trade globe…</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const host=document.body,scene=new THREE.Scene();scene.background=new THREE.Color('#0b1724');
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(0,0,6.8);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb8d9ed,0x122436,1.7));const key=new THREE.DirectionalLight(0xffe4c2,2.6);key.position.set(4,3,5);scene.add(key);const fill=new THREE.DirectionalLight(0x398bc4,1.1);fill.position.set(-5,-1,-4);scene.add(fill);
const world=new THREE.Group();scene.add(world);
const earthMat=new THREE.MeshPhongMaterial({color:0x2d7392,specular:0x3a91b8,shininess:22});const earth=new THREE.Mesh(new THREE.SphereGeometry(2,72,56),earthMat);world.add(earth);
const loader=new THREE.TextureLoader();loader.setCrossOrigin('anonymous');loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',t=>{t.colorSpace=THREE.SRGBColorSpace;earthMat.map=t;earthMat.color.set(0xffffff);earthMat.needsUpdate=true},undefined,()=>{});
const atmosphere=new THREE.Mesh(new THREE.SphereGeometry(2.09,48,40),new THREE.MeshBasicMaterial({color:0x54bdf0,transparent:true,opacity:.11,side:THREE.BackSide}));world.add(atmosphere);
const starsGeo=new THREE.BufferGeometry(),starPositions=[];for(let i=0;i<650;i++){const v=new THREE.Vector3().randomDirection().multiplyScalar(THREE.MathUtils.randFloat(4,13));starPositions.push(v.x,v.y,v.z)}starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPositions,3));scene.add(new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0x9fc9dc,size:.012,transparent:true,opacity:.55})));
function pos(lat,lon,r=2.035){const p=(90-lat)*Math.PI/180,l=(lon+180)*Math.PI/180;return new THREE.Vector3(-r*Math.sin(p)*Math.cos(l),r*Math.cos(p),r*Math.sin(p)*Math.sin(l))}
const places=[['Shanghai',31.23,121.47,'#ff9871'],['Shenzhen',22.57,114.06,'#ff9871'],['Ningbo',29.87,121.55,'#ff9871'],['Chennai',13.08,80.27,'#77d2ff'],['Mumbai',19.07,72.87,'#77d2ff'],['Visakhapatnam',17.69,83.22,'#77d2ff']];
const dots=[];for(const [name,lat,lon,color] of places){const p=pos(lat,lon);const dot=new THREE.Mesh(new THREE.SphereGeometry(.035,14,12),new THREE.MeshBasicMaterial({color}));dot.position.copy(p);world.add(dot);dots.push(dot)}
const routePoints=[];const a=pos(22.57,114.06,2.045),b=pos(13.08,80.27,2.045);for(let i=0;i<=80;i++){const t=i/80;const v=a.clone().lerp(b,t).normalize().multiplyScalar(2.045+Math.sin(Math.PI*t)*.25);routePoints.push(v)}const route=new THREE.CatmullRomCurve3(routePoints);const routeMesh=new THREE.Mesh(new THREE.TubeGeometry(route,100,.009,6,false),new THREE.MeshBasicMaterial({color:0xf1b65d,transparent:true,opacity:.95}));world.add(routeMesh);
const pulse=new THREE.Mesh(new THREE.SphereGeometry(.055,16,12),new THREE.MeshBasicMaterial({color:0xffd27b}));world.add(pulse);
const ring=new THREE.Mesh(new THREE.TorusGeometry(2.17,.008,6,100),new THREE.MeshBasicMaterial({color:0x64c9f1,transparent:true,opacity:.35}));ring.rotation.x=1.15;ring.rotation.y=.35;world.add(ring);
let down=false,lastX=0,lastY=0,rotY=-.7,rotX=.1,targetY=rotY,targetX=rotX;renderer.domElement.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;targetY+=(e.clientX-lastX)*.006;targetX+=(e.clientY-lastY)*.004;targetX=THREE.MathUtils.clamp(targetX,-.65,.65);lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',()=>down=false);renderer.domElement.addEventListener('pointercancel',()=>down=false);
let zoom=6.8;renderer.domElement.addEventListener('wheel',e=>{zoom=THREE.MathUtils.clamp(zoom+e.deltaY*.004,4.6,9);camera.position.z=zoom},{passive:true});
let raf=0,visible=true;const clock=new THREE.Clock();function animate(){const t=clock.getElapsedTime();if(!down)targetY+=.0008;rotY+=(targetY-rotY)*.045;rotX+=(targetX-rotX)*.045;world.rotation.set(rotX,rotY,0);const p=route.getPoint((t*.055)%1);pulse.position.copy(p);pulse.scale.setScalar(1+Math.sin(t*5)*.18);dots.forEach((d,i)=>d.scale.setScalar(1+Math.sin(t*2.3+i)*.13));renderer.render(scene,camera);if(visible)raf=requestAnimationFrame(animate)}
const io=new IntersectionObserver(([e])=>{visible=e.isIntersecting;if(visible){cancelAnimationFrame(raf);animate()}else cancelAnimationFrame(raf)});io.observe(document.documentElement);
new ResizeObserver(()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}).observe(document.body);
document.querySelector('#fallback').remove();animate();
</script></body></html>
